name: Release Please

# Runs on every push to main, also empty release commits. The old paths filter skipped
# those, so a release without a file change never opened a release PR.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    # Alleen in de public repo. Private main krijgt hetzelfde bestand mee, maar heeft geen token.
    if: github.repository == '0125joel/PIM-Monitor'
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
